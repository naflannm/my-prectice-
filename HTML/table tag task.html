<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan and rowspan</title>
</head>
<body>
    <h2><u>Colspan tag</u></h2>
    <table border="1px">
       <tr>
      <th colspan="4">Title</th>
       </tr>     
       <tr>
        <th Colspan="2"> subtitle </th>
        <th colspan="2"> subtitle </th>
       </tr>
       <tr>
        <td> 1 item<br>
            1 item <br>
            1 item
        </td>
       
       
      <td> 123<br>
            123<br>
            123
        </td>

          <td> 1 item<br>
            1 item <br>
            1 item
        </td>
       
       
      <td> 123<br>
            123<br>
            123
        </td>
       </tr>
       <tr>
        <th colspan="2">subtitle</th>
        <th colspan="2">subtitle</th>
       </tr>
        

    </table>
    <br>
    <hr>
    <h2><u>Rowspan tag</u></h2>

    <table border="1px" cellpadding="10px " cellspacing="6px" width="50%">
        <tr>
           <td><u>ID</u></td>
           <td> <u>NAME</u></td>
           <td><u>SUBJECT</u></td>
           <td> <u>MARKS</u></td>
           
           </tr>    
        
        <tr>
            <tr></tr>
               <td rowspan="3">1</td>
               <td rowspan="3">David</td>
               <td>Maths</td>
               <td>80</td>
            <tr>
               <td>Pysics</td>
               <td>90</td>  
            </tr>
                 
               
              
            <tr>
               <td>Computer</td>
               <td>70</td>
            </tr>
             
            
               

            <tr>
               <td rowspan="3">2</td>
               <td rowspan="3">Alex</td>
               <td>Maths</td>
               <td>80</td>
            </tr>
            
            <tr>
             
               <td bgcolor="yellow">Pysics</td>
               <td>85</td>
            </tr>
           

            <tr>
                 
               <td bgcolor="red ">computer</td>
               <td>80</td>

            </tr>
         
        </tr>

    </table>

</body>

</html>
